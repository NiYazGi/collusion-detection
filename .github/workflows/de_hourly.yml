name: Сбор цен Германия

on:
  schedule:
    - cron: "5 * * * *"     # каждый час
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: de-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Собрать
        env:
          TK_APIKEY: ${{ secrets.TK_APIKEY }}
          TK_LAT: ${{ vars.TK_LAT }}
          TK_LNG: ${{ vars.TK_LNG }}
          TK_RAD: ${{ vars.TK_RAD }}
        run: python collect_de.py

      - name: Сохранить
        if: always()
        run: |
          git config user.name "data-collector"
          git config user.email "actions@github.com"
          git pull --rebase || true
          git add data/
          git diff --staged --quiet || git commit -m "DE $(date -u +%Y-%m-%dT%H:%M)"
          git push
